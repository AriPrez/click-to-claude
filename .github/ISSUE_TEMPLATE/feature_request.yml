name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety impact
      description: Could this affect screenshots, clipboard data, browser targeting, or temporary files?
  - type: dropdown
    id: desktop
    attributes:
      label: Primary environment
      options:
        - All Linux desktops
        - X11
        - GNOME Wayland
        - KDE Wayland
        - wlroots Wayland
        - Packaging or documentation
