name: Bug report
description: Report a reproducible problem without exposing private data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Click to Claude. Never attach private screenshots, credentials, browser-profile data, or unsanitized window titles.
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `click-to-claude --version`.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Desktop session
      options:
        - X11
        - GNOME Wayland
        - KDE Wayland
        - wlroots Wayland
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Press Super+C
        2. Select a region
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste `click-to-claude --diagnose` output after removing private information.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private screenshots, usernames, paths, and sensitive window titles.
          required: true
