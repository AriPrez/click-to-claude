[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "click-to-claude"
version = "0.5.2"
description = "Annotate a Linux screenshot and paste it safely into Claude."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AriPrez"}]
dependencies = ["Pillow>=9"]
keywords = [
    "annotation",
    "claude",
    "linux",
    "screenshot",
    "wayland",
    "x11",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.urls]
Homepage = "https://github.com/AriPrez/click-to-claude"
Documentation = "https://github.com/AriPrez/click-to-claude#readme"
Issues = "https://github.com/AriPrez/click-to-claude/issues"
Source = "https://github.com/AriPrez/click-to-claude"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
click-to-claude = "click_claude:main"

[tool.setuptools]
py-modules = ["click_claude", "editor_ui"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
